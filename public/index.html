<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zed's Log — Anime &amp; Manga News</title>
  <meta name="description" content="Anime and manga news from across the Grand Line (and the web), logged by @mugiwara_no_Zed.">
  <meta name="theme-color" content="#0b1a2e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="./">
        <img class="brand-mark" src="favicon.svg" alt="" width="38" height="38">
        <span class="brand-text">
          <span>Zed's <b>Log</b></span>
          <small>anime &amp; manga news · by @mugiwara_no_Zed</small>
        </span>
      </a>
      <label class="search">
        <span class="visually-hidden">Search news</span>
        <input id="q" type="search" placeholder="Search the seas — titles, series, studios…" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </div>
    <nav class="wrap tabs" aria-label="Topic">
      <button class="tab active" data-topic="all">All</button>
      <button class="tab" data-topic="anime">Anime</button>
      <button class="tab" data-topic="manga">Manga</button>
      <button class="tab" data-topic="saved">★ Treasure</button>
      <span class="meta" id="updated"></span>
      <a class="x-link" href="https://x.com/mugiwara_no_Zed" target="_blank" rel="noopener noreferrer" aria-label="Follow @mugiwara_no_Zed on X">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z"/></svg>
        Follow
      </a>
    </nav>
  </header>

  <main class="wrap">
    <details class="sources" id="sources-box">
      <summary>Sources <span id="source-count"></span></summary>
      <div class="chips" id="sources"></div>
    </details>

    <p class="status" id="status">Setting sail for the latest news…</p>
    <section class="grid" id="grid" aria-live="polite"></section>
    <button class="more" id="more" hidden>Load more</button>
  </main>

  <footer class="wrap foot">
    <p>Charted by <a href="https://x.com/mugiwara_no_Zed" target="_blank" rel="noopener noreferrer">@mugiwara_no_Zed</a> on X 🏴‍☠️</p>
    <p>Headlines link to their original publishers. Zed's Log only aggregates public RSS feeds.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <a class="thumb" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt=""></a>
      <div class="body">
        <div class="row">
          <span class="source"></span>
          <span class="topics"></span>
        </div>
        <h2><a target="_blank" rel="noopener noreferrer"></a></h2>
        <p class="summary"></p>
        <div class="row foot-row">
          <time></time>
          <button class="save" aria-label="Save to treasure">☆</button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
